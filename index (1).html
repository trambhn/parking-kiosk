@keyframes kspin{to{transform:rotate(360deg)}}
@keyframes kblink{0%{opacity:1}50%{opacity:0}}
html,body{margin:0;height:100%;background:#0f1113;overflow:hidden;overscroll-behavior:none}
body{-webkit-text-size-adjust:100%}
#app{position:fixed;left:0;top:0;width:100vw;height:100vh;display:flex;flex-direction:column;overflow-x:hidden;overflow-y:hidden;-webkit-overflow-scrolling:touch}
#app.wide{overflow-y:auto}
#app.wide #stage{flex:none}
#panel{flex-shrink:0;margin:8px;padding:8px 10px;background:#D7DADE;color:#1d2125;border:2px dashed #7d838b;border-radius:10px;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;user-select:none;-webkit-user-select:none}
#panel .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#4b5159}
#panel .grp{display:flex;align-items:center;gap:6px;flex-wrap:wrap;flex:1 1 auto;min-width:0}
#panel .grp>span{font-weight:600;white-space:nowrap}
#panel .opts{display:flex;gap:6px;flex:1 1 auto;min-width:0}
#panel button{font:inherit;min-height:44px;min-width:44px;padding:6px 12px;border-radius:8px;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;line-height:1.15}
#panel .opt{flex:1 1 0;min-width:0;background:#F4F5F6;color:#1d2125;border:1.5px solid #8a9098;display:flex;align-items:center;justify-content:center;gap:6px;text-align:center}
#panel .opt[aria-pressed="true"]{background:#2b3036;color:#fff;border-color:#2b3036;font-weight:700}
#panel .opt .dot{width:14px;height:14px;border-radius:50%;border:2px solid currentColor;box-sizing:border-box;flex-shrink:0}
#panel .opt[aria-pressed="true"] .dot{background:#fff;box-shadow:inset 0 0 0 2px #2b3036}
#panel .act{display:flex;gap:6px;margin-left:auto}
#panel .ins{background:#4b5159;color:#fff;border:1.5px solid #4b5159;font-weight:700}
#panel .ins:disabled{background:#c4c8cd;color:#5b6068;border-color:#a8adb3;cursor:default}
#panel .rst{background:transparent;color:#1d2125;border:1.5px solid #4b5159;font-weight:600}
#stage{flex:1;min-height:0;position:relative;overflow:hidden}
#kiosk{position:absolute;left:0;top:0;width:1120px;height:740px;overflow:hidden;transform-origin:0 0;border-radius:12px;font-family:'Atkinson Hyperlegible Next','Atkinson Hyperlegible',system-ui,sans-serif;user-select:none;-webkit-user-select:none}
.key{position:absolute;box-sizing:border-box;box-shadow:0 5px 0 var(--sh),inset 0 2px 0 rgba(255,255,255,.33);cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;display:flex;align-items:center;justify-content:center}
.key:active,.key.down{transform:translateY(4px);box-shadow:0 1px 0 var(--sh)}
.hit{position:absolute;left:50%;top:50%;width:max(100%,var(--t,0px));height:max(100%,var(--t,0px));transform:translate(-50%,-50%)}

  var now=new Date(), mins=S.adds.reduce(function(a,b){return a+b;},0);
  var until=new Date(now.getTime()+mins*60000), hh=Math.floor(mins/60), mm=mins%60;
  var dur= mins===0?'0 min':[hh?hh+(hh===1?' hour':' hours'):'', mm?mm+' min':''].filter(Boolean).join(' ');
  return {mins:mins, duration:dur, untilFull: mins? until.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})+' · '+fmtT(until):'—', amount:money(price(now,mins))};
}

function header(){
  var m=META[S.screen]; if(!m) return '';
  var step=m[1], pips='';
  for(var i=0;i<4;i++){var done=i<step-1, cur=i===step-1; pips+='<div style="width:'+(cur?40:24)+'px; height:10px; background:'+(done||cur?'#1C2D74':'#FFFFFF')+'; border:2px solid '+(done||cur?'#1C2D74':'#6B7380')+'; box-sizing:border-box;"></div>';}
  var now=new Date();
  return '<div style="position:absolute; left:0; top:0; width:800px; height:80px; border-bottom:3px solid #111418; box-sizing:border-box; display:flex; align-items:center; gap:16px; padding:0 24px; background:#fff;">'+
  '<img src="'+LOGO+'" alt="Canada Wide Parking" style="height:44px; width:auto; display:block; flex-shrink:0;">'+
  '<div style="width:2px; height:48px; background:#C9CDD3; flex-shrink:0;"></div>'+
  '<div style="flex:1; min-width:0; display:flex; flex-direction:column; gap:6px;"><div style="font-size:32px; line-height:36px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">'+m[0]+'</div>'+
  '<div style="display:flex; align-items:center; gap:10px;"><span style="font-size:20px; line-height:24px; font-weight:700; color:#1C2D74;">Step '+step+' of 4</span><div style="display:flex; gap:6px; align-items:center;">'+pips+'</div></div></div>'+
  '<div style="display:flex; flex-direction:column; align-items:flex-end; gap:2px; flex-shrink:0;"><div data-clock="t" style="font-size:32px; line-height:36px; font-weight:700; white-space:nowrap;">'+fmtT(now)+'</div><div data-clock="d" style="font-size:20px; line-height:24px; white-space:nowrap;">'+fmtD(now)+'</div></div></div>';
}

function body(){
  var c=calc(), s=S.screen;
  if(s==='plate'){
    var err=S.plateErr==='blank';
    return '<div style="position:absolute; left:24px; top:96px; width:752px; text-align:center; '+T32+'">Enter your <span style="color:#1C2D74;">licence plate number</span> to begin</div>'+
    '<div style="position:absolute; left:120px; top:146px; width:560px; height:64px; box-sizing:border-box; border:'+(err?4:3)+'px solid '+(err?'#8A1C7C':'#1C2D74')+'; border-radius:8px; background:#fff; padding:0 20px; display:flex; align-items:center; justify-content:'+(S.plate.length>22?'flex-end':'flex-start')+'; overflow:hidden;"><div style="display:flex; align-items:center; flex-shrink:0; white-space:pre; font-size:32px; line-height:38px; font-weight:700; letter-spacing:.06em;">'+esc(S.plate)+'<div style="width:4px; height:38px; margin-left:2px; background:#1C2D74; animation:kblink 1.06s steps(1) infinite;"></div></div></div>'+
    (err?'<div style="position:absolute; left:120px; top:218px; width:560px; display:flex; align-items:center; gap:10px; font-size:24px; line-height:32px; font-weight:700; color:#8A1C7C;"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3L2 21h20L12 3z"></path><path d="M12 10v5M12 18v.01"></path></svg>Enter your licence plate to continue.</div>':'')+
    '<div style="position:absolute; left:24px; top:262px; width:752px; display:flex; justify-content:center; gap:40px; font-size:20px; line-height:24px;">'+
    '<div style="display:flex; flex-direction:column;"><b>Mon–Fri, 6am–6pm</b><span><b style="color:#1C2D74;">$3.50</b> every 30 min</span><span><b style="color:#1C2D74;">Max $17</b> for all 12 hours</span></div>'+
    '<div style="display:flex; flex-direction:column;"><b>Any day, 6pm–6am</b><b style="color:#1C2D74;">$10</b></div>'+
    '<div style="display:flex; flex-direction:column;"><b>Sat–Sun, 6am–6pm</b><b style="color:#1C2D74;">Flat Rate $7</b></div></div>'+
    '<div style="'+ROW+'"><div style="'+PILL_R_OFF+'">'+cA+'Cancel</div><div style="'+PILL_G+'">Confirm'+gA+'</div></div>'+
    tab(580,'Parking Code');
  }
  if(s==='time'){
    return '<div style="position:absolute; left:24px; top:96px; width:300px; display:flex; flex-direction:column; gap:12px;"><div style="'+T32+' text-wrap:pretty;">How long would you like to park?</div><div style="font-size:24px; line-height:32px;">Use the physical buttons below to select:</div></div>'+
    '<div style="position:absolute; left:340px; top:96px; width:436px; height:240px; border:2px solid #111418; border-radius:8px; box-sizing:border-box; padding:8px 20px; display:flex; flex-direction:column; justify-content:center;">'+
    '<div style="'+LAB+'">Licence plate</div><div style="font-size:24px; line-height:28px; font-weight:700;">'+esc(S.plate)+'</div>'+
    '<div style="'+LAB+'">Parking duration</div><div style="font-size:32px; line-height:36px; font-weight:700; color:#1C2D74; white-space:nowrap;">'+c.duration+'</div>'+
    '<div style="'+LAB+'">Parking until</div><div style="font-size:32px; line-height:36px; font-weight:700; color:#1C2D74; white-space:nowrap;">'+c.untilFull+'</div>'+
    '<div style="'+LAB+'">Amount due</div><div style="font-size:24px; line-height:28px; font-weight:700;">'+c.amount+'</div></div>'+
    '<div style="'+ROW+'"><div style="'+PILL_R+'">'+cA+'Back/Undo</div>'+(c.mins?'<div style="'+PILL_G+'">Confirm'+gA+'</div>':'<div style="'+PILL_G_OFF+'">Confirm'+gA+'</div>')+'</div>'+
    tab(28,'+ 30 min')+tab(212,'+ 1 hour')+tab(396,'+ 2 hours')+tab(580,'+ 3 hours');
  }
  if(s==='pay'){
    var V='font-size:24px; line-height:28px; font-weight:700; white-space:nowrap;';
    return '<div style="position:absolute; left:424px; top:96px; width:352px; height:240px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px;"><img src="'+CARD+'" alt="" style="width:112px; height:112px; display:block;"><div style="'+T32+' text-align:center; text-wrap:balance;">Insert your credit or debit card</div></div>'+
    '<div style="position:absolute; left:24px; top:96px; width:376px; height:240px; border:2px solid #111418; border-radius:8px; box-sizing:border-box; padding:8px 20px; display:flex; flex-direction:column; justify-content:center; gap:4px;">'+
    '<div style="display:flex; flex-direction:column;"><div style="'+LAB+'">Licence plate</div><div style="'+V+'">'+esc(S.plate)+'</div></div>'+
    '<div style="display:flex; flex-direction:column;"><div style="'+LAB+'">Parking time</div><div style="'+V+'">'+c.untilFull+'</div></div>'+
    '<div style="display:flex; flex-direction:column;"><div style="'+LAB+'">Duration</div><div style="'+V+'">'+c.duration+'</div></div>'+
    '<div style="display:flex; flex-direction:column;"><div style="'+LAB+'">Total</div><div style="'+V+'">'+c.amount+'</div></div></div>'+
    '<div style="'+ROW+'"><div style="'+PILL_R+'">'+cA+'Back</div></div>';
  }
  if(s==='processing') return '<div style="'+CENTER+'"><div style="'+T32+'">Payment processing...</div>'+SPIN+'</div>';
  if(s==='nofunds'||s==='notaccepted') return '<div style="'+CENTER+'"><div style="display:flex; flex-direction:column; gap:4px;"><div style="'+T32+'">'+(s==='nofunds'?'Card declined: not enough funds':'Card not accepted')+'</div><div style="font-size:24px; line-height:32px;">Please try another card</div></div>'+XC+'</div>';
  if(s==='accepted') return '<div style="'+CENTER+'">'+CHECK+'<div style="'+T32+'">Card accepted</div></div>';
  if(s==='printing') return '<div style="'+CENTER+'">'+SPIN+'<div style="'+T32+'">Please wait, printing ticket...</div></div>';
  if(s==='take') return '<div style="'+CENTER+'">'+CHECK+'<div style="'+T32+'">Please take your ticket</div></div>';
  return '';
}

var screenEl=document.getElementById('screen'), kin=document.getElementById('kin'), insBtn=document.getElementById('insert');
function render(){
  screenEl.innerHTML='<div style="position:relative; width:800px; height:480px; overflow:hidden; background:#fff; color:#111418;">'+header()+
  '<div style="position:absolute; left:0; top:416px; width:800px; height:64px; background:#EDF0F3; border-top:2px solid #111418; box-sizing:border-box;"></div>'+body()+'</div>';
  insBtn.disabled = S.screen!=='pay';
  if(kin.value!==S.plate) kin.value=S.plate;
}
function set(patch){for(var k in patch) S[k]=patch[k]; render();}
function focusIn(){ if(S.screen!=='plate') return; try{kin.focus({preventScroll:true});}catch(e){kin.focus();} }
function go(screen,patch){ var p=patch||{}; p.screen=screen; set(p); if(screen==='plate') focusIn(); else kin.blur(); }
function later(ms,fn){ clearTimeout(timer); timer=setTimeout(fn,ms); }
function process(result){
  go('processing');
  later(2600,function(){
    go(result);
    if(result!=='accepted') later(4000,function(){go('pay');});
    else later(2500,function(){ go('printing'); later(3000,function(){ go('take'); later(5000,function(){ S=fresh(); render(); focusIn(); }); }); });
  });
}
function onKey(id){
  if(navigator.vibrate) try{navigator.vibrate(12);}catch(e){}
  var ch=/^[A-Z0-9]$/.test(id);
  switch(S.screen){
    case 'plate':
      if(ch) set({plate:S.plate+id, plateErr:''});
      else if(id==='bksp') set({plate:S.plate.slice(0,-1), plateErr:''});
      else if(id==='confirm'){ if(!S.plate.length) set({plateErr:'blank'}); else go('time'); }
      break;
    case 'time':
      var inc={sk1:30,sk2:60,sk3:120,sk4:180}[id];
      if(inc) set({adds:S.adds.concat(inc)});
      else if(id==='cancel'){ if(S.adds.length) set({adds:S.adds.slice(0,-1)}); else go('plate'); }
      else if(id==='confirm' && S.adds.length) go('pay');
      break;
    case 'pay': if(id==='cancel') go('time'); break;
  }
}

document.querySelectorAll('.key').forEach(function(k){
  k.addEventListener('click',function(e){ e.stopPropagation(); onKey(k.getAttribute('data-key')); });
});
screenEl.addEventListener('click',focusIn);
kin.addEventListener('input',function(){
  if(S.screen!=='plate') return;
  var v=(kin.value||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,40);
  if(navigator.vibrate) try{navigator.vibrate(12);}catch(e){}
  set({plate:v, plateErr:''});
});
kin.addEventListener('keydown',function(e){
  if(e.key==='Enter'){e.preventDefault(); onKey('confirm');}
  else if(e.key==='Escape'){e.preventDefault(); onKey('cancel');}
  else if(/^F[1-4]$/.test(e.key)){e.preventDefault(); onKey('sk'+e.key[1]);}
});
window.addEventListener('keydown',function(e){
  if(e.target===kin) return;
  if(e.target && e.target.tagName==='BUTTON' && (e.key==='Enter'||e.key===' ')) return;
  var k=e.key, id=null;
  if(/^[a-z0-9]$/i.test(k)) id=k.toUpperCase();
  else if(k==='Backspace') id='bksp';
  else if(k==='Enter') id='confirm';
  else if(k==='Escape') id='cancel';
  else if(/^F[1-4]$/.test(k)) id='sk'+k[1];
  if(id){e.preventDefault(); onKey(id);}
});

document.querySelectorAll('#panel .opt').forEach(function(b){
  b.addEventListener('click',function(){
    card=b.getAttribute('data-card');
    document.querySelectorAll('#panel .opt').forEach(function(o){o.setAttribute('aria-pressed', o===b?'true':'false');});
  });
});
insBtn.addEventListener('click',function(){ if(S.screen==='pay') process(card); });
document.getElementById('restart').addEventListener('click',function(){ clearTimeout(timer); S=fresh(); render(); focusIn(); });

setInterval(function(){
  var now=new Date();
  var t=screenEl.querySelector('[data-clock="t"]'), d=screenEl.querySelector('[data-clock="d"]');
  if(t) t.textContent=fmtT(now); if(d) d.textContent=fmtD(now);
},1000);

var app=document.getElementById('app'), stage=document.getElementById('stage'), kiosk=document.getElementById('kiosk');
function layout(){
  var vv=window.visualViewport;
  var W=vv?vv.width:window.innerWidth, H=vv?vv.height:window.innerHeight;
  if(!(W>0&&H>0)) return;
  app.style.width=W+'px'; app.style.height=H+'px';
  if(vv){ app.style.transform='translate('+vv.offsetLeft+'px,'+vv.offsetTop+'px)'; }
  var coarse=window.matchMedia&&matchMedia('(pointer: coarse)').matches;
  var phoneSideways=coarse && W>H && H<600;
  var pad=W<600||phoneSideways?6:Math.round(Math.min(W,H)*0.02);
  var s, kw, kh;
  if(phoneSideways){
    app.classList.add('wide');
    s=(W-pad*2)/1120; kw=1120*s; kh=740*s;
    stage.style.height=Math.ceil(kh+pad*2)+'px';
    kiosk.style.transform='translate('+pad+'px,'+pad+'px) scale('+s+')';
  } else {
    app.classList.remove('wide'); stage.style.height='';
    var sw=stage.clientWidth-pad*2, sh=stage.clientHeight-pad*2;
    if(sw<=0||sh<=0) return;
    s=Math.min(sw/1120, sh/740); kw=1120*s; kh=740*s;
    kiosk.style.transform='translate('+Math.round((stage.clientWidth-kw)/2)+'px,'+Math.round((stage.clientHeight-kh)/2)+'px) scale('+s+')';
  }
  kiosk.style.setProperty('--t',(48/s)+'px');
}
window.addEventListener('resize',layout);
window.addEventListener('orientationchange',function(){setTimeout(layout,250);});
if(window.visualViewport){ visualViewport.addEventListener('resize',layout); visualViewport.addEventListener('scroll',layout); }
if(window.ResizeObserver) new ResizeObserver(layout).observe(document.documentElement);

render(); layout(); requestAnimationFrame(layout); setTimeout(layout,300);
if(document.fonts && document.fonts.ready) document.fonts.ready.then(layout);
focusIn();
})();
</script>
</body>
</html>
